# PutraWorks MetaTrader-AI - Compile & Strategy Test
name: Compile & Test

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to test"
        default: "XAUUSD"
        type: string
      period:
        description: "Timeframe"
        default: "H1"
        type: choice
        options: [M1, M5, M15, M30, H1, H4, D1]
      from_date:
        description: "Start date (YYYY.MM.DD)"
        default: "2025.01.01"
        type: string
      to_date:
        description: "End date (YYYY.MM.DD)"
        default: "2025.06.01"
        type: string
      test_model:
        description: "Test model (0=Every Tick, 1=1-min OHLC, 2=Open Prices)"
        default: "1"
        type: choice
        options: ["0", "1", "2"]
  push:
    branches: [main]
    paths:
      - "**/*.mq5"
      - "**/*.mqh"
      - ".github/workflows/compile-and-test.yml"

env:
  MT5_URL: "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download & install MT5
        shell: powershell
        run: |
          Write-Host "Downloading MT5 installer..."
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "$env:MT5_URL" -OutFile "mt5setup.exe"
          Write-Host "Installing MT5 (silent)..."
          Start-Process -FilePath "mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 10
          $mtDir = Get-ChildItem "C:\Program Files\MetaTrader*" -Directory | Select-Object -First 1 -ExpandProperty FullName
          if (!$mtDir) { $mtDir = "C:\Program Files\MetaTrader 5" }
          Write-Host "MT5 installed at: $mtDir"
          echo "MT5_PATH=$mtDir" >> $env:GITHUB_ENV
          $me = Join-Path $mtDir "metaeditor64.exe"
          if (-not (Test-Path $me)) { Write-Host "ERROR: metaeditor64.exe not found!"; exit 1 }
          Write-Host "MetaEditor found: $me"

      - name: Initialize MT5 terminal (first run)
        shell: powershell
        run: |
          $mtDir = $env:MT5_PATH
          $terminal = Join-Path $mtDir "terminal64.exe"
          Write-Host "Starting terminal briefly to initialize MQL5 data directory..."
          $p = Start-Process -FilePath $terminal -PassThru
          Start-Sleep -Seconds 45
          $p | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "Terminal initialized"

      - name: Setup MQL5 directories & copy tools
        shell: powershell
        run: |
          $mtDir = $env:MT5_PATH
          $mqlDir = Join-Path $mtDir "MQL5"
          $tools = @(
            @{ Src="Expert Advisors (EAs)"; Dest="Experts" },
            @{ Src="Custom Indicators"; Dest="Indicators" },
            @{ Src="Scripts"; Dest="Scripts" }
          )
          foreach ($t in $tools) {
            if (Test-Path $t.Src) {
              Get-ChildItem $t.Src -Directory | ForEach-Object {
                $dest = Join-Path $mqlDir "$($t.Dest)\$($_.Name)"
                Copy-Item $_.FullName $dest -Recurse -Force
                Write-Host "Copied: $($t.Dest)/$($_.Name)"
              }
            }
          }
          $libSrc = "Libraries"
          if (Test-Path $libSrc) {
            $libIncDir = Join-Path $mqlDir "Include"
            if (-not (Test-Path $libIncDir)) { New-Item -ItemType Directory -Force -Path $libIncDir | Out-Null }
            Get-ChildItem $libSrc -Directory | ForEach-Object {
              $inc = Join-Path $_.FullName "Include"
              if (Test-Path $inc) {
                Get-ChildItem $inc -Filter "*.mqh" | ForEach-Object {
                  Copy-Item $_.FullName (Join-Path $libIncDir $_.Name) -Force
                }
              }
            }
          }
          echo "MQL5_DIR=$mqlDir" >> $env:GITHUB_ENV

      - name: Diagnostics & Compile
        shell: powershell
        run: |
          $me = Join-Path $env:MT5_PATH "metaeditor64.exe"
          $mqlDir = $env:MQL5_DIR
          
          Write-Host "=== DIAGNOSTICS ==="
          Write-Host "MetaEditor: $me"
          Write-Host "MQL5 dir: $mqlDir"
          Write-Host "MQL5 dir exists: $(Test-Path $mqlDir)"
          
          # Check Include dir
          $stdInc = Join-Path $mqlDir "Include"
          Write-Host "Include dir exists: $(Test-Path $stdInc)"
          if (Test-Path $stdInc) {
            $incCount = (Get-ChildItem $stdInc -Recurse -File).Count
            Write-Host "Include files count: $incCount"
            Get-ChildItem $stdInc | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.Name)" }
          }
          
          # Check AppData terminal data dirs
          $appData = Join-Path $env:APPDATA "MetaQuotes\Terminal"
          Write-Host "`nAppData Terminal: $appData"
          Write-Host "AppData Terminal exists: $(Test-Path $appData)"
          if (Test-Path $appData) {
            Get-ChildItem $appData -Directory | ForEach-Object {
              Write-Host "  Terminal: $($_.Name)"
              $tdInc = Join-Path $_.FullName "MQL5\Include"
              if (Test-Path $tdInc) {
                $c = (Get-ChildItem $tdInc -Recurse -File).Count
                Write-Host "    MQL5\Include exists ($c files)"
              } else {
                Write-Host "    MQL5\Include NOT found"
              }
              $tdMql = Join-Path $_.FullName "MQL5"
              if (Test-Path $tdMql) {
                Write-Host "    MQL5 dirs:"
                Get-ChildItem $tdMql -Directory | Select-Object -First 5 | ForEach-Object { Write-Host "      $($_.Name)" }
              }
            }
          }
          
          # Test compile a minimal file
          Write-Host "`n=== TEST COMPILE ==="
          $testFile = Join-Path $mqlDir "Scripts\_test.mq5"
          Set-Content -Path $testFile -Value 'void OnStart() { Print("compile test"); }' -Encoding UTF8
          $testLog = Join-Path $mqlDir "Scripts\_test.log"
          Write-Host "Test file: $testFile"
          Write-Host "Test file exists: $(Test-Path $testFile)"
          
          $proc = Start-Process -FilePath $me -ArgumentList "/compile:`"$testFile`" /log:`"$testLog`"" -PassThru -Wait -NoNewWindow
          Write-Host "Exit code: $($proc.ExitCode)"
          Write-Host "Test log exists: $(Test-Path $testLog)"
          if (Test-Path $testLog) { Write-Host "Test log content:"; Get-Content $testLog -Raw | Write-Host }
          $testEx5 = [System.IO.Path]::ChangeExtension($testFile, ".ex5")
          Write-Host "Test .ex5 exists: $(Test-Path $testEx5)"
          
          # Search for ANY log/ex5 files created
          Write-Host "`n=== SEARCH FOR LOG FILES ==="
          Get-ChildItem $mqlDir -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
          Write-Host "`n=== SEARCH FOR .EX5 FILES ==="
          Get-ChildItem $mqlDir -Recurse -Filter "*.ex5" -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
          
          # Search AppData too
          if (Test-Path $appData) {
            Write-Host "`n=== APPDATA LOG FILES ==="
            Get-ChildItem $appData -Recurse -Filter "*.log" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
            Write-Host "`n=== APPDATA .EX5 FILES ==="
            Get-ChildItem $appData -Recurse -Filter "*.ex5" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
          }
          
          # If test compiled OK, compile real files
          if (Test-Path $testEx5) {
            Write-Host "`n=== COMPILING REAL FILES ==="
            $mq5Files = Get-ChildItem $mqlDir -Recurse -Filter "*.mq5" | Where-Object {
              $_.FullName -notmatch "Archive" -and $_.FullName -notmatch "Tests" -and $_.Name -notmatch "_test"
            }
            Write-Host "Found $($mq5Files.Count) .mq5 files to compile"
            $errors = 0; $compiled = 0
            foreach ($f in $mq5Files) {
              $logFile = Join-Path $f.DirectoryName "$($f.BaseName).log"
              $proc = Start-Process -FilePath $me -ArgumentList "/compile:`"$($f.FullName)`" /log:`"$logFile`"" -PassThru -Wait -NoNewWindow
              $ex5 = [System.IO.Path]::ChangeExtension($f.FullName, ".ex5")
              if (Test-Path $ex5) { Write-Host "  OK: $($f.Name)"; $compiled++ }
              else {
                Write-Host "  FAIL: $($f.Name) (exit: $($proc.ExitCode))"
                $errors++
                if (Test-Path $logFile) { Write-Host "  LOG: $(Get-Content $logFile -Raw)" }
              }
            }
            Write-Host "`nCompiled: $compiled / $($mq5Files.Count), Errors: $errors"
            if ($errors -gt 0) { exit 1 }
          } else {
            Write-Host "`nTest compile failed - compiler not working. Check diagnostics above."
            exit 1
          }

      - name: Upload compiled .ex5 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-ex5
          path: |
            ${{ env.MQL5_DIR }}/**/*.ex5
          if-no-files-found: warn
          retention-days: 30

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compile-logs
          path: |
            ${{ env.MQL5_DIR }}/**/*.log
          if-no-files-found: warn
          retention-days: 30

  test:
    needs: compile
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        ea: [BreakoutEA, GridTradingEA, NewsTradingEA, ScalpingEA, TrailingStopEA]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiled .ex5
        uses: actions/download-artifact@v4
        with:
          name: compiled-ex5
          path: ex5

      - name: Install MT5 & run strategy test
        shell: powershell
        run: |
          $ProgressPreference = "SilentlyContinue"
          Invoke-WebRequest -Uri "$env:MT5_URL" -OutFile "mt5setup.exe"
          Start-Process -FilePath "mt5setup.exe" -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 10
          $mtDir = Get-ChildItem "C:\Program Files\MetaTrader*" -Directory | Select-Object -First 1 -ExpandProperty FullName
          if (!$mtDir) { $mtDir = "C:\Program Files\MetaTrader 5" }
          
          $dataDir = Join-Path $env:USERPROFILE "MT5_TestData"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          
          $config = @"
          ; PutraWorks Strategy Tester Config
          [Tester]
          Expert=${{ matrix.ea }}\${{ matrix.ea }}_v0.0.4.ex5
          Symbol=${{ github.event.inputs.symbol || 'XAUUSD' }}
          Period=${{ github.event.inputs.period || 'H1' }}
          Model=${{ github.event.inputs.test_model || '1' }}
          FromDate=${{ github.event.inputs.from_date || '2025.01.01' }}
          ToDate=${{ github.event.inputs.to_date || '2025.06.01' }}
          ForwardMode=0
          Deposit=10000
          Currency=USD
          ExecutionMode=0
          Optimization=0
          Visual=0
          Report=report.html
          "@
          
          $configPath = Join-Path $dataDir "config.ini"
          Set-Content -Path $configPath -Value $config -Encoding UTF8
          
          $ex5File = Get-ChildItem "ex5" -Recurse -Filter "${{ matrix.ea }}*.ex5" | Select-Object -First 1
          if ($ex5File) {
            $eaDir = Join-Path $dataDir "MQL5\Experts\${{ matrix.ea }}"
            New-Item -ItemType Directory -Force -Path $eaDir | Out-Null
            Copy-Item $ex5File.FullName (Join-Path $eaDir $ex5File.Name) -Force
          }
          
          $terminal = Join-Path $mtDir "terminal64.exe"
          Write-Host "Running strategy test for ${{ matrix.ea }}..."
          $proc = Start-Process -FilePath $terminal -ArgumentList "/portable /config:`"$configPath`"" -PassThru -Wait
          Start-Sleep -Seconds 60
          
          $reportPath = Join-Path $dataDir "report.html"
          if (Test-Path $reportPath) {
            Write-Host "Report found!"
            $report = Get-Content $reportPath -Raw
            Write-Host $report
          } else {
            Write-Host "No report found at: $reportPath"
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.ea }}
          path: |
            ${{ env.USERPROFILE }}/MT5_TestData/report.html
            ${{ env.USERPROFILE }}/MT5_TestData/*.log
          if-no-files-found: warn
          retention-days: 30
